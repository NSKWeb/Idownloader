services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nika
      POSTGRES_PASSWORD: nika
      POSTGRES_DB: nbrowser
    ports:
      - "5432:5432"
    volumes:
      - nbrowser_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nbrowser_redis:/data

volumes:
  nbrowser_postgres:
  nbrowser_redis:
